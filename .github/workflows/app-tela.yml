name: App Tela do carro

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/app-tela.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-tela-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Monta o APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Confere o APK e a assinatura
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256'
          "$BT/aapt2" dump badging "$APK" | head -4

      - name: Liga a aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testa a trava num tablet virtual (Android 13)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: bash android/testar-no-emulador.sh android/app/build/outputs/apk/release/app-release.apk telas

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tela-do-carro
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            telas/

      - name: Publica o APK no site (pasta tela/app)
        if: success() && github.ref == 'refs/heads/claude/github-conectado-nrhseu'
        run: |
          mkdir -p tela/app
          cp android/app/build/outputs/apk/release/app-release.apk tela/app/tela-do-carro.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tela/app/tela-do-carro.apk
          git commit -m 'APK do app Tela do carro (montado e testado no Actions)' || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
