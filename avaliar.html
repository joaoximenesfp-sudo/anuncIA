<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Avalie sua compra — Tech Campinas</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1221">
<script src="tema.js"></script>
<link rel="preload" href="/fontes/inter-latin-opsz.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Inter Variable";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(/fontes/inter-latin-opsz.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --navy:#0B1221; --g1:#1CF08F; --g2:#00B368; --estrela:#F5B301;
  --bg:#F4F6F9; --card:#FFFFFF; --tx:#0B1221; --mu:#556070; --li:#8A94A3; --b:#E3E7ED; --chip:#EFF2F6; --erro:#C2410C;
  --fonte:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter Variable","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#070B14; --card:#101828; --tx:#E9EEF6; --mu:#9BA7B9; --li:#6E7A8D; --b:#1D2839; --chip:#172235; --erro:#FB923C; }
}
:root[data-theme="dark"]{ --bg:#070B14; --card:#101828; --tx:#E9EEF6; --mu:#9BA7B9; --li:#6E7A8D; --b:#1D2839; --chip:#172235; --erro:#FB923C; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fonte);-webkit-font-smoothing:antialiased}
b,strong,h1,h2{font-weight:600}
.topo{background:var(--navy);color:#fff;padding:16px}
.topo a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;font-weight:600;letter-spacing:.02em}
.topo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--g1),var(--g2));display:inline-block}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--b);border-radius:20px;padding:22px 18px;box-shadow:0 1px 2px rgba(11,18,33,.05),0 12px 32px rgba(11,18,33,.08)}
h1{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 18px;line-height:1.45}
.maq{display:inline-block;background:var(--chip);border-radius:999px;padding:5px 12px;font-size:.85rem;margin-bottom:18px}
.estrelas{display:flex;gap:6px;margin:4px 0 6px}
.estrelas input{position:absolute;opacity:0;pointer-events:none}
.estrelas label{font-size:2.6rem;line-height:1;color:var(--b);cursor:pointer;transition:transform .1s;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.estrelas label.on{color:var(--estrela)}
.estrelas label:active{transform:scale(.92)}
.estrelas input:focus-visible+label{outline:2px solid var(--g2);outline-offset:3px;border-radius:6px}
.nota-txt{color:var(--mu);font-size:.9rem;min-height:1.3em;margin-bottom:16px}
label.campo{display:block;font-size:.85rem;color:var(--mu);margin:14px 0 6px}
textarea,input[type=text]{width:100%;font:inherit;font-size:1rem;color:var(--tx);background:var(--bg);border:1px solid var(--b);border-radius:12px;padding:12px}
textarea{min-height:120px;resize:vertical}
.conta{font-size:.75rem;color:var(--li);text-align:right;margin-top:4px}
.ok-pub{display:flex;gap:10px;align-items:flex-start;margin:16px 0 4px;font-size:.9rem;color:var(--mu);line-height:1.4}
.ok-pub input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--g2)}
.bt{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;text-align:center;text-decoration:none;margin-top:16px}
.bt-pri{background:var(--g2);color:#fff}
.bt-pri:disabled{opacity:.55;cursor:default}
.bt-sec{background:var(--chip);color:var(--tx)}
.erro{color:var(--erro);font-size:.9rem;margin-top:12px;min-height:1.2em}
.fim{text-align:center}
.fim .grande{font-size:3rem;margin-bottom:6px}
.carregando{color:var(--mu);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="topo"><a href="/catalogo.html"><i></i><span id="lojaNome">Tech Campinas</span></a></div>
<main>
  <div class="card" id="caixa"><div class="carregando">Abrindo…</div></div>
</main>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const codigo = (new URLSearchParams(location.hash.slice(1)).get('c') || new URLSearchParams(location.search).get('c') || '').trim();
  const ROTULO = ['', 'Ruim', 'Fraca', 'Boa', 'Muito boa', 'Excelente'];
  const FS = 'https://firestore.googleapis.com/v1/projects/anuncia-70b88/databases/(default)/documents/catalogo_cfg/loja?key=AIzaSyDmC5BxL2_qf7YT9Yq9gUIhpRBn0RoRa2A';
  let loja = { nome: 'Tech Campinas', google: '', instagram: '' };
  let nota = 0;

  // os dados da loja (nome e o link de avaliação no Google), públicos como no catálogo
  const lojaPronta = fetch(FS).then(r => r.ok ? r.json() : null).then(j => {
    const f = (j && j.fields) || {}, s = k => (f[k] && f[k].stringValue) || '';
    if (s('nome')) loja.nome = s('nome');
    if (/^https:\/\//.test(s('google_avaliar'))) loja.google = s('google_avaliar');
    loja.instagram = s('instagram').replace(/^@/, '');
    $('lojaNome').textContent = loja.nome;
  }).catch(() => {});

  function aviso(icone, titulo, texto) {
    $('caixa').innerHTML = `<div class="fim"><div class="grande">${icone}</div><h1>${esc(titulo)}</h1><p class="sub">${esc(texto)}</p>
      <a class="bt bt-sec" href="/catalogo.html">Ver as máquinas</a></div>`;
  }
  async function abrir() {
    if (!/^[a-f0-9]{24}$/.test(codigo)) return aviso('🔗', 'Link incompleto', 'Abra de novo o link que a loja mandou pelo WhatsApp.');
    let r, j;
    try { r = await fetch('/api/avaliacoes?convite=' + codigo, { cache: 'no-store' }); j = await r.json(); }
    catch (e) { return aviso('📶', 'Sem conexão', 'Confira a internet e abra o link de novo.'); }
    if (!r.ok || !j.ok) return aviso(j && j.usado ? '💚' : '🔗', j && j.usado ? 'Avaliação já enviada' : 'Link indisponível', (j && j.erro) || 'Peça um novo link para a loja.');
    formulario(j);
  }
  function formulario(c) {
    const ola = c.cliente ? `Oi, ${esc(c.cliente)}! ` : '';
    $('caixa').innerHTML = `
      <h1>Como foi a sua compra?</h1>
      <p class="sub">${ola}Sua opinião ajuda outras pessoas a escolher. Leva 1 minuto.</p>
      ${c.produto ? `<div class="maq">💻 ${esc(c.produto)}</div>` : ''}
      <div class="estrelas" role="radiogroup" aria-label="Nota de 1 a 5 estrelas">
        ${[1, 2, 3, 4, 5].map(n => `<input type="radio" name="nota" id="n${n}" value="${n}"><label for="n${n}" title="${ROTULO[n]}" aria-label="${n} estrela${n > 1 ? 's' : ''}">★</label>`).join('')}
      </div>
      <div class="nota-txt" id="notaTxt">Toque nas estrelas</div>
      <label class="campo" for="texto">Conte como está sendo o notebook e o atendimento</label>
      <textarea id="texto" maxlength="600" placeholder="Ex.: chegou bem revisado, rápido para o trabalho e o atendimento foi ótimo."></textarea>
      <div class="conta" id="conta">0/600</div>
      <label class="campo" for="nome">Seu nome, como vai aparecer no site</label>
      <input type="text" id="nome" maxlength="40" autocomplete="given-name" value="${esc(c.cliente || '')}" placeholder="Ex.: Carlos E.">
      <label class="ok-pub"><input type="checkbox" id="autorizo"> <span>Autorizo a ${esc(loja.nome)} a publicar esta avaliação, com este nome, no site da loja.</span></label>
      <button class="bt bt-pri" id="enviar" disabled>Enviar avaliação</button>
      <div class="erro" id="erro" role="alert"></div>`;
    const marcar = n => { nota = n; document.querySelectorAll('.estrelas label').forEach((l, i) => l.classList.toggle('on', i < n)); $('notaTxt').textContent = ROTULO[n]; validar(); };
    document.querySelectorAll('.estrelas input').forEach(i => i.addEventListener('change', () => marcar(+i.value)));
    const validar = () => { $('enviar').disabled = !(nota && $('texto').value.trim().length >= 10 && $('nome').value.trim().length >= 2 && $('autorizo').checked); };
    $('texto').addEventListener('input', () => { $('conta').textContent = $('texto').value.length + '/600'; validar(); });
    $('nome').addEventListener('input', validar);
    $('autorizo').addEventListener('change', validar);
    $('enviar').addEventListener('click', enviar);
  }
  async function enviar() {
    const bt = $('enviar'); bt.disabled = true; bt.textContent = 'Enviando…'; $('erro').textContent = '';
    try {
      const r = await fetch('/api/avaliacoes', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ acao: 'enviar', convite: codigo, nota, texto: $('texto').value, nome: $('nome').value, autorizo: $('autorizo').checked }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.erro || 'Não consegui enviar agora. Tente de novo.');
      await lojaPronta;
      obrigado();
    } catch (e) {
      $('erro').textContent = e.message || 'Não consegui enviar agora. Tente de novo.';
      bt.disabled = false; bt.textContent = 'Enviar avaliação';
    }
  }
  function obrigado() {
    $('caixa').innerHTML = `<div class="fim"><div class="grande">💚</div><h1>Obrigado pela avaliação!</h1>
      <p class="sub">Ela aparece no site da ${esc(loja.nome)} depois que a loja confere.</p>
      ${loja.google ? `<a class="bt bt-pri" href="${esc(loja.google)}" target="_blank" rel="noopener">⭐ Avaliar também no Google</a>` : ''}
      ${loja.instagram ? `<a class="bt bt-sec" href="https://www.instagram.com/${esc(loja.instagram)}/" target="_blank" rel="noopener">Seguir no Instagram</a>` : ''}
      <a class="bt bt-sec" href="/catalogo.html">Ver as máquinas</a></div>`;
  }
  lojaPronta.finally(abrir);
})();
</script>
</body>
</html>
