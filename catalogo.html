<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catálogo — máquinas disponíveis</title>
<meta name="description" content="Notebooks e desktops seminovos, com garantia. Veja o que está disponível hoje.">
<meta name="theme-color" content="#0B1221">
<meta property="og:title" content="Catálogo de notebooks e desktops">
<meta property="og:description" content="Notebooks e desktops disponíveis, com garantia. Toque para ver fotos e preço.">
<meta property="og:type" content="website">
<style>
  :root{
    --bg:#f4f5f7; --w:#ffffff; --tx:#12161d; --mu:#5c6572; --li:#8a929e;
    --b:#e3e6ea; --ac:#00b368; --ac2:#1cf08f; --nav:#0b1221;
    --wa:#25d366; --al:#b26a00; --albg:#fff6e5;
    --sh:0 1px 2px rgba(16,22,34,.05), 0 6px 18px rgba(16,22,34,.06);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0d1117; --w:#161b23; --tx:#e8ecf2; --mu:#9aa4b2; --li:#6e7783;
      --b:#252c37; --nav:#080c14; --albg:#3a2c10; --al:#f0b429;
      --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --w:#161b23; --tx:#e8ecf2; --mu:#9aa4b2; --li:#6e7783;
    --b:#252c37; --nav:#080c14; --albg:#3a2c10; --al:#f0b429;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:0 14px 40px}

  /* ── topo ── */
  header{background:var(--nav);color:#fff;padding:22px 0 18px;margin-bottom:16px}
  header .wrap{padding-bottom:0}
  .lg{display:flex;align-items:center;gap:12px}
  .lg-mk{width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,#1cf08f,#00b368);
    display:grid;place-items:center;flex:none}
  .lg-mk svg{width:26px;height:26px}
  .lg-nm{font-size:1.08rem;font-weight:800;letter-spacing:-.2px;line-height:1.2}
  .lg-sb{font-size:.76rem;color:#9fb0c4;margin-top:2px}
  .hd-bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .hd-bt{flex:1;min-width:150px;display:flex;align-items:center;justify-content:center;gap:7px;
    background:var(--wa);color:#fff;text-decoration:none;font-weight:700;font-size:.86rem;
    padding:11px 14px;border-radius:10px}
  .hd-bt.sec{background:rgba(255,255,255,.1);color:#fff}

  /* ── filtros ── */
  .fl{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;margin-bottom:4px}
  .bs{width:100%;padding:11px 13px;border:1px solid var(--b);border-radius:10px;background:var(--w);
    color:var(--tx);font-size:.92rem;font-family:inherit}
  .bs::placeholder{color:var(--li)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;-webkit-overflow-scrolling:touch;
    scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;font-size:.76rem;font-weight:600;padding:6px 12px;border-radius:20px;
    border:1px solid var(--b);background:var(--w);color:var(--mu);cursor:pointer;white-space:nowrap;
    font-family:inherit}
  .chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
  .chips.tipos{padding-bottom:0}
  .chips.tipos .chip{font-size:.79rem;font-weight:700;padding:7px 14px}
  .chips.tipos .chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .cont{font-size:.76rem;color:var(--li);margin:4px 2px 12px}

  /* ── grade ── */
  .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .cd{background:var(--w);border:1px solid var(--b);border-radius:14px;overflow:hidden;
    box-shadow:var(--sh);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .12s ease}
  .cd:active{transform:scale(.985)}
  .cd-im{aspect-ratio:4/3;background:var(--bg);position:relative;overflow:hidden}
  .cd-im img{width:100%;height:100%;object-fit:cover;display:block}
  .cd-im .sem{width:100%;height:100%;display:grid;place-items:center;color:var(--li);font-size:.78rem}
  .cd-ch{position:absolute;left:8px;top:8px;background:#f59e0b;color:#3b2200;
    font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.01em}
  .cd.cheg{border-color:#f4c77a}
  .cd-pr.breve{font-size:.9rem;color:var(--al);font-weight:700}
  .dt-pr.breve{font-size:1.05rem;color:var(--al)}
  .dt-cheg{background:var(--albg);border:1px solid var(--al);color:var(--al);border-radius:10px;
    padding:9px 12px;font-size:.79rem;font-weight:600;line-height:1.55;margin-bottom:12px}
  .cd-nf{position:absolute;right:8px;bottom:8px;background:rgba(8,12,20,.72);color:#fff;
    font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:20px;backdrop-filter:blur(4px)}
  .cd-bd{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
  .cd-nm{font-size:.85rem;font-weight:700;line-height:1.35}
  .cd-sp{display:flex;flex-wrap:wrap;gap:4px}
  .sp{font-size:.66rem;font-weight:600;color:var(--mu);background:var(--bg);border:1px solid var(--b);
    padding:2px 7px;border-radius:20px;white-space:nowrap}
  .sp.bat-boa{color:var(--ac);border-color:var(--ac);background:transparent}
  .sp.bat-ruim{color:var(--al);border-color:var(--al);background:var(--albg)}
  .cd-pr{font-size:1.12rem;font-weight:800;letter-spacing:-.3px;margin-top:auto;padding-top:2px}

  /* ── detalhe ── */
  .ov{position:fixed;inset:0;background:rgba(6,10,18,.62);z-index:60;display:none;
    align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
  .ov.on{display:flex}
  .dt{background:var(--w);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;
    border-radius:18px 18px 0 0;-webkit-overflow-scrolling:touch}
  @media(min-width:640px){ .ov{align-items:center} .dt{border-radius:18px;max-height:88vh} }
  .dt-x{position:sticky;top:0;background:var(--w);padding:10px 14px;border-bottom:1px solid var(--b);
    display:flex;align-items:center;justify-content:space-between;z-index:2}
  .dt-x b{font-size:.9rem}
  .dt-x button{border:none;background:var(--bg);color:var(--mu);width:32px;height:32px;
    border-radius:50%;font-size:1rem;cursor:pointer;line-height:1;font-family:inherit}
  .car-wrap{position:relative;background:var(--bg)}
  .car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    background:var(--bg);scrollbar-width:none}
  .car::-webkit-scrollbar{display:none}
  .car img{width:100%;flex:none;scroll-snap-align:center;aspect-ratio:4/3;object-fit:contain;display:block}
  .car .carregando{width:100%;aspect-ratio:4/3;display:grid;place-items:center;color:var(--li);font-size:.82rem}
  /* Setas: no celular o dedo arrasta, no computador não existe gesto nenhum
     e a barra de rolagem está escondida — sem elas a foto 2 fica invisível. */
  .car-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;
    border:none;border-radius:50%;background:rgba(8,12,20,.6);color:#fff;font-size:1.4rem;
    line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 3px;
    backdrop-filter:blur(4px);transition:opacity .15s ease;font-family:inherit}
  .car-nav:hover{background:rgba(8,12,20,.8)}
  .car-nav.prev{left:8px} .car-nav.next{right:8px}
  .car-nav[hidden]{display:none}
  .pts{display:flex;gap:6px;justify-content:center;padding:10px 0 2px}
  .pt{width:7px;height:7px;border-radius:50%;background:var(--b);border:none;padding:0;cursor:pointer;
    transition:background .15s ease}
  .pt.on{background:var(--mu)}
  .dt-desc{font-size:.86rem;line-height:1.65;color:var(--tx);white-space:pre-line;margin-bottom:14px}
  .dt-bd{padding:14px 16px 20px}
  .dt-nm{font-size:1.06rem;font-weight:800;line-height:1.3;margin-bottom:4px}
  .dt-pr{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;margin:8px 0 12px}
  .dt-sp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
  .gar{background:var(--bg);border:1px solid var(--b);border-radius:11px;padding:11px 13px;
    font-size:.79rem;color:var(--mu);line-height:1.65;margin-bottom:14px}
  .gar b{color:var(--tx)}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--wa);color:#fff;
    text-decoration:none;font-weight:800;font-size:.95rem;padding:14px;border-radius:12px}

  /* ── estados ── */
  .est{text-align:center;padding:52px 20px;color:var(--mu)}
  .est .ic{font-size:2.2rem;margin-bottom:10px}
  .est h2{font-size:1rem;margin:0 0 6px;color:var(--tx)}
  .est p{font-size:.85rem;margin:0;line-height:1.6}
  .sk{background:var(--w);border:1px solid var(--b);border-radius:14px;overflow:hidden}
  .sk .im{aspect-ratio:4/3;background:linear-gradient(90deg,var(--bg) 25%,var(--b) 50%,var(--bg) 75%);
    background-size:200% 100%;animation:sh 1.3s linear infinite}
  .sk .ln{height:11px;margin:11px 12px;border-radius:6px;background:var(--bg)}
  .sk .ln.c{width:55%}
  @keyframes sh{to{background-position:-200% 0}}
  footer{text-align:center;color:var(--li);font-size:.72rem;padding:26px 14px 10px;line-height:1.7}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="lg">
      <div class="lg-mk">
        <svg viewBox="0 0 800 800" aria-hidden="true">
          <rect x="232" y="222" width="336" height="232" rx="26" fill="none" stroke="#06231A" stroke-width="46"/>
          <polyline points="300,347 356,403 492,268" fill="none" stroke="#06231A" stroke-width="56"
                    stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="168" y="486" width="464" height="52" rx="26" fill="#06231A"/>
        </svg>
      </div>
      <div>
        <div class="lg-nm" id="lojaNome">Catálogo</div>
        <div class="lg-sb" id="lojaSub">carregando…</div>
      </div>
    </div>
    <div class="hd-bar" id="hdBar"></div>
  </div>
</header>

<div class="wrap">
  <div class="fl" id="filtros" hidden>
    <input class="bs" id="busca" type="search" placeholder="🔎 Buscar por modelo, marca, processador…" autocomplete="off">
    <div class="chips tipos" id="tipos"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="cont" id="contagem"></div>
  <div class="gr" id="grade"></div>
  <div id="vazio"></div>
</div>

<footer id="rodape"></footer>

<div class="ov" id="ov" onclick="if(event.target===this)fechar()">
  <div class="dt" id="dt"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore,collection,getDocs,query,where,orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDmC5BxL2_qf7YT9Yq9gUIhpRBn0RoRa2A",authDomain:"anuncia-70b88.firebaseapp.com",projectId:"anuncia-70b88",storageBucket:"anuncia-70b88.firebasestorage.app",messagingSenderId:"325014740359",appId:"1:325014740359:web:eff4e874f9f18a2ba54722"});
const db=getFirestore(app);

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt=v=>'R$ '+Math.round(Number(v)||0).toLocaleString('pt-BR');
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

let itens=[], cfg={}, tipoSel='', marcaSel='', busca='';
const cacheFotos={};   // produto_id -> [dataUrl]

// ── carregar ────────────────────────────────────────────────────────────
function esqueleto(){
  $('grade').innerHTML=Array.from({length:6},()=>
    '<div class="sk"><div class="im"></div><div class="ln"></div><div class="ln c"></div></div>').join('');
}

function estado(ic,titulo,texto){
  $('grade').innerHTML='';
  $('vazio').innerHTML=`<div class="est"><div class="ic">${ic}</div><h2>${esc(titulo)}</h2><p>${texto}</p></div>`;
}

async function carregar(){
  esqueleto();
  try{
    const [snapC,snapI]=await Promise.all([
      getDocs(collection(db,'catalogo_cfg')),
      getDocs(query(collection(db,'catalogo'),orderBy('preco','desc')))
    ]);
    snapC.forEach(d=>{ if(d.id==='loja') cfg=d.data()||{}; });
    itens=snapI.docs.map(d=>({id:d.id,...d.data()}));
    // Chegando vai pro fim: quem abre o catálogo quer comprar hoje. O que
    // ainda não chegou é bônus, não pode empurrar o disponível pra baixo.
    itens.sort((a,b)=>{
      const ca=a.estado==='chegando'?1:0, cb=b.estado==='chegando'?1:0;
      if(ca!==cb) return ca-cb;
      return (Number(b.preco)||0)-(Number(a.preco)||0);
    });
  }catch(e){
    console.error(e);
    $('lojaSub').textContent='—';
    estado('📡','Não consegui carregar o catálogo',
      'Pode ser a conexão. Tente atualizar a página em alguns instantes.');
    return;
  }
  cabecalho();
  if(!itens.length){
    $('lojaSub').textContent='nenhuma máquina no momento';
    estado('📦','Nenhuma máquina disponível agora',
      'O estoque muda toda semana. Chame no WhatsApp que eu aviso quando entrar o que você procura.');
    if(cfg.whatsapp) $('vazio').insertAdjacentHTML('beforeend',
      `<div style="max-width:340px;margin:0 auto"><a class="cta" href="${waLink()}">💬 Falar no WhatsApp</a></div>`);
    return;
  }
  $('filtros').hidden=false;
  montarTipos();
  montarChips();
  render();
  rodape();
}

function waNum(){ return String(cfg.whatsapp||'').replace(/\D/g,''); }
function waLink(msg){
  const n=waNum();
  const t=encodeURIComponent(msg||`Olá! Vi o catálogo e queria mais informações.`);
  return n ? `https://wa.me/55${n.replace(/^55/,'')}?text=${t}` : `https://wa.me/?text=${t}`;
}

function cabecalho(){
  $('lojaNome').textContent=cfg.nome||'Catálogo';
  const nCheg=itens.filter(i=>i.estado==='chegando').length;
  const nDisp=itens.length-nCheg;
  $('lojaSub').textContent=`${nDisp} máquina${nDisp!==1?'s':''} disponíve${nDisp!==1?'is':'l'}`+
    (nCheg?` · ${nCheg} chegando`:'')+(cfg.cidade?` · ${cfg.cidade}`:'');
  const bts=[];
  if(waNum()) bts.push(`<a class="hd-bt" href="${waLink()}" target="_blank" rel="noopener">💬 Chamar no WhatsApp</a>`);
  if(cfg.instagram) bts.push(`<a class="hd-bt sec" href="https://instagram.com/${esc(String(cfg.instagram).replace(/^@/,''))}" target="_blank" rel="noopener">📷 Instagram</a>`);
  bts.push(`<button class="hd-bt sec" id="btShare" type="button">🔗 Compartilhar</button>`);
  $('hdBar').innerHTML=bts.join('');
  const bs=$('btShare');
  if(bs) bs.onclick=()=>compartilhar(bs);
}

// Qualquer visitante pode repassar o catálogo: no celular abre a bandeja de
// compartilhamento do sistema, no computador copia o endereço.
async function compartilhar(bt){
  const url=location.href.split('#')[0];
  const dados={ title:(cfg.nome||'Catálogo')+' — notebooks e desktops disponíveis',
                text:'Dá uma olhada nas máquinas disponíveis:', url };
  if(navigator.share){
    try{ await navigator.share(dados); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  const antes=bt.textContent;
  try{ await navigator.clipboard.writeText(url); bt.textContent='✅ Link copiado'; }
  catch(e){ bt.textContent='🔗 '+url; }
  setTimeout(()=>{ bt.textContent=antes; },2200);
}

function rodape(){
  const q=cfg.publicado_em ? new Date(cfg.publicado_em) : null;
  const quando=q&&!isNaN(q) ? q.toLocaleDateString('pt-BR') : '';
  $('rodape').innerHTML=
    `Todas as máquinas saem com <b>90 dias de garantia</b>.`+
    (quando?`<br>Catálogo atualizado em ${quando}. Preços sujeitos a alteração.`:'<br>Preços sujeitos a alteração.');
}

// ── filtros ─────────────────────────────────────────────────────────────
// Notebook e desktop são compras diferentes: quem quer levar pra faculdade não
// quer ver mini pra mesa, e vice-versa. Por isso o tipo vem antes da marca.
const TIPOS=[['notebook','💻 Notebooks'],['desktop','🖥️ Desktops']];

function montarTipos(){
  const cont={};
  itens.forEach(i=>{ const t=i.tipo==='desktop'?'desktop':'notebook'; cont[t]=(cont[t]||0)+1; });
  const presentes=TIPOS.filter(([v])=>cont[v]);
  const el=$('tipos');
  // Um tipo só: o filtro não serve pra nada e vira ruído.
  if(presentes.length<2){ el.innerHTML=''; el.style.display='none'; tipoSel=''; return; }
  el.style.display='';
  el.innerHTML=`<button class="chip${tipoSel?'':' on'}" data-t="">Tudo <span style="opacity:.65">${itens.length}</span></button>`+
    presentes.map(([v,rot])=>`<button class="chip${tipoSel===v?' on':''}" data-t="${v}">${rot} <span style="opacity:.65">${cont[v]}</span></button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>{
    b.onclick=()=>{ tipoSel=b.dataset.t; marcaSel=''; montarTipos(); montarChips(); render(); };
  });
}

// As marcas contam dentro do tipo escolhido: com "Desktops" ligado, "Dell 3"
// tem que significar 3 desktops Dell, não 3 máquinas Dell no total.
function montarChips(){
  const base=itens.filter(i=>!tipoSel || (i.tipo==='desktop'?'desktop':'notebook')===tipoSel);
  const cont={};
  base.forEach(i=>{ const m=i.marca||'Outros'; cont[m]=(cont[m]||0)+1; });
  const marcas=Object.keys(cont).sort((a,b)=>cont[b]-cont[a]);
  $('chips').innerHTML=
    `<button class="chip${marcaSel?'':' on'}" data-m="">Todas <span style="opacity:.6">${base.length}</span></button>`+
    marcas.map(m=>`<button class="chip${marcaSel===m?' on':''}" data-m="${esc(m)}">${esc(m)} <span style="opacity:.6">${cont[m]}</span></button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>{
    b.onclick=()=>{ marcaSel=b.dataset.m; montarChips(); render(); };
  });
}

function filtrados(){
  const q=norm(busca).trim();
  return itens.filter(i=>{
    if(tipoSel && (i.tipo==='desktop'?'desktop':'notebook')!==tipoSel) return false;
    if(marcaSel && (i.marca||'Outros')!==marcaSel) return false;
    if(!q) return true;
    const alvo=norm((i.nome||'')+' '+(i.marca||'')+' '+(i.specs||[]).join(' '));
    return q.split(/\s+/).every(t=>alvo.includes(t));
  });
}

function render(){
  const lista=filtrados();
  $('vazio').innerHTML='';
  const total=itens.length;
  $('contagem').textContent = lista.length===total
    ? `${total} máquina${total!==1?'s':''}`
    : `${lista.length} de ${total} máquina${total!==1?'s':''}`;
  if(!lista.length){
    $('grade').innerHTML='';
    estado('🔍','Nada com esse filtro','Tente outra marca ou apague a busca.');
    $('contagem').textContent=`0 de ${total} máquinas`;
    return;
  }
  $('grade').innerHTML=lista.map(cartao).join('');
  $('grade').querySelectorAll('[data-id]').forEach(el=>{
    el.onclick=()=>abrir(el.dataset.id);
  });
}

function chipSpec(s){
  const cls = /^🔋/.test(s) ? (/(\d+)%/.test(s) ? (parseInt(s.match(/(\d+)%/)[1])>=80?' bat-boa':(parseInt(s.match(/(\d+)%/)[1])<50?' bat-ruim':'')) : '') : '';
  return `<span class="sp${cls}">${esc(s)}</span>`;
}

function cartao(i){
  const capa = i.capa
    ? `<img src="${i.capa}" alt="${esc(i.nome)}" loading="lazy">`
    : `<div class="sem">sem foto</div>`;
  const n = Number(i.n_fotos)||0;
  const cheg = i.estado==='chegando';
  const preco = (Number(i.preco)||0)>0
    ? `<div class="cd-pr">${fmt(i.preco)}</div>`
    : `<div class="cd-pr breve">Preço em breve</div>`;
  return `<div class="cd${cheg?' cheg':''}" data-id="${esc(i.id)}">
    <div class="cd-im">${capa}
      ${cheg?'<span class="cd-ch">🚚 chegando</span>':''}
      ${n>1?`<span class="cd-nf">📷 ${n}</span>`:''}
    </div>
    <div class="cd-bd">
      <div class="cd-nm">${esc(i.nome)}</div>
      <div class="cd-sp">${(i.specs||[]).slice(0,3).map(chipSpec).join('')}</div>
      ${preco}
    </div>
  </div>`;
}

// ── detalhe ─────────────────────────────────────────────────────────────
async function fotosDe(id){
  if(cacheFotos[id]) return cacheFotos[id];
  try{
    const snap=await getDocs(query(collection(db,'catalogo_fotos'),where('produto_id','==',id)));
    const arr=snap.docs.map(d=>d.data()).sort((a,b)=>(a.ordem||0)-(b.ordem||0)).map(f=>f.dataUrl).filter(Boolean);
    cacheFotos[id]=arr; return arr;
  }catch(e){ console.error(e); cacheFotos[id]=[]; return []; }
}

window.fechar=()=>{ $('ov').classList.remove('on'); document.body.style.overflow=''; };

async function abrir(id){
  const i=itens.find(x=>x.id===id); if(!i) return;
  const cheg = i.estado==='chegando';
  const temPreco = (Number(i.preco)||0)>0;
  // A conversa começa diferente conforme o caso: pedir uma máquina que ainda
  // não chegou não é a mesma pergunta que pedir uma que está na prateleira.
  const msg = cheg
    ? `Olá! Vi no catálogo que o *${i.nome}* está chegando${temPreco?` por ${fmt(i.preco)}`:''}. Dá pra reservar?`
    : `Olá! Tenho interesse no *${i.nome}* por ${fmt(i.preco)}, que vi no catálogo. Ainda está disponível?`;
  $('dt').innerHTML=`
    <div class="dt-x"><b>Detalhes</b><button onclick="fechar()" aria-label="Fechar">✕</button></div>
    <div class="car-wrap">
      <div class="car" id="car">${ i.capa
          ? `<img src="${i.capa}" alt="${esc(i.nome)}">`
          : `<div class="carregando">sem foto</div>` }</div>
      <button class="car-nav prev" id="carPrev" aria-label="Foto anterior" hidden>‹</button>
      <button class="car-nav next" id="carNext" aria-label="Próxima foto" hidden>›</button>
    </div>
    <div class="pts" id="pts"></div>
    <div class="dt-bd">
      <div class="dt-nm">${esc(i.nome)}</div>
      <div class="dt-pr${temPreco?'':' breve'}">${temPreco?fmt(i.preco):'Preço em breve'}</div>
      ${ cheg ? `<div class="dt-cheg">🚚 Essa máquina ainda está chegando. Dá pra reservar agora e garantir antes de entrar à venda.</div>` : '' }
      <div class="dt-sp">${(i.specs||[]).map(chipSpec).join('')||'<span class="sp">specs não informadas</span>'}</div>
      ${ i.descricao ? `<div class="dt-desc">${esc(i.descricao)}</div>` : '' }
      <div class="gar">
        ✅ <b>90 dias de garantia</b> a partir da entrega.<br>
        🔧 Testada antes da venda: memória, armazenamento e limpeza interna.<br>
        🚚 Entrega combinada na região e envio por Correios com rastreio.
      </div>
      <a class="cta" href="${waLink(msg)}" target="_blank" rel="noopener">${cheg?'🚚 Quero reservar':'💬 Tenho interesse'}</a>
    </div>`;
  $('ov').classList.add('on');
  document.body.style.overflow='hidden';
  $('dt').scrollTop=0;

  const car=$('car');
  if(Number(i.n_fotos)>1){
    car.insertAdjacentHTML('beforeend','<div class="carregando" id="carLoad">carregando fotos…</div>');
    const fotos=await fotosDe(id);
    if($('ov').classList.contains('on') && document.getElementById('car')===car){
      if(fotos.length){
        car.innerHTML=fotos.map(u=>`<img src="${u}" alt="${esc(i.nome)}">`).join('');
        pontos(car,fotos.length);
      } else {
        const l=document.getElementById('carLoad'); if(l) l.remove();
      }
    }
  }
}

// Navegação do carrossel. Três caminhos pro mesmo lugar, porque cada aparelho
// tem o seu: dedo no celular, seta no computador, bolinha nos dois.
function pontos(car,n){
  if(n<2) return;
  const el=$('pts'), prev=$('carPrev'), next=$('carNext');
  el.innerHTML=Array.from({length:n},(_,k)=>
    `<button class="pt${k===0?' on':''}" data-k="${k}" aria-label="Foto ${k+1}"></button>`).join('');
  const irPara=k=>car.scrollTo({left:Math.max(0,Math.min(n-1,k))*car.clientWidth,behavior:'smooth'});
  const atual=()=>Math.round(car.scrollLeft/Math.max(1,car.clientWidth));

  el.querySelectorAll('.pt').forEach(b=>{ b.onclick=()=>irPara(Number(b.dataset.k)); });
  if(prev){ prev.hidden=false; prev.onclick=()=>irPara(atual()-1); }
  if(next){ next.hidden=false; next.onclick=()=>irPara(atual()+1); }

  const marcar=()=>{
    const k=atual();
    el.querySelectorAll('.pt').forEach((p,j)=>p.classList.toggle('on',j===k));
    if(prev) prev.style.opacity = k<=0 ? '.25' : '1';
    if(next) next.style.opacity = k>=n-1 ? '.25' : '1';
  };
  car.onscroll=marcar;
  marcar();
  // Setas do teclado, já que a página abre bastante no computador
  car.tabIndex=0;
  car.onkeydown=e=>{
    if(e.key==='ArrowRight'){ e.preventDefault(); irPara(atual()+1); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); irPara(atual()-1); }
  };
}

$('busca').oninput=e=>{ busca=e.target.value; render(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fechar(); });

carregar();
</script>
